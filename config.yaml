# Illustrative inputs for the educational simulation only.
# Values are not clinical recommendations and are not attributed to trial protocols.
# Only settings read by this implementation are included.
version: "2026.10-rc1"
hemodynamic_thresholds:
  hr_critical_low: 48
  map_critical_low: 60
pharmacokinetics:
  dexmedetomidine:
    # Unvalidated one-central-compartment plus effect-site example.
    central_volume_L_per_kg: 0.8
    elimination_rate_constant_k10: 0.04
    effect_site_transfer_k1e: 0.1
drug_dosing:
  # Historical field name retained for compatibility; simulation values only.
  dexmedetomidine:
    standard_dose: 0.5
    geriatric_dose: 0.25
    geriatric_age_threshold: 65
  ketamine:
    standard_dose: 0.2
  lidocaine:
    standard_dose: 1.5
contraindications:
  # Incomplete illustrative string matching, not a clinical contraindication database.
  dexmedetomidine:
    cardiac_conditions: ["Heart Block", "AV Block", "3rd Degree AV Block", "Sick Sinus Syndrome", "Severe Bradycardia"]
  ketorolac:
    egfr_minimum: 30
    allergy_triggers: ["NSAID", "Ketorolac", "Aspirin"]
age_adjustments:
  geriatric:
    age_threshold: 65
