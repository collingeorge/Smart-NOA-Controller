# Illustrative inputs for the educational simulation only.
# Values are not clinical recommendations and are not attributed to trial protocols.
# Only settings read by this implementation are included.
version: "2026.10-rc1"
hemodynamic_thresholds:
  hr_critical_low: 48
  map_critical_low: 60
pharmacokinetics:
  dexmedetomidine:
    # Unvalidated one-central-compartment plus effect-site example.
    central_volume_L_per_kg: 0.8
    elimination_rate_constant_k10: 0.04
    effect_site_transfer_k1e: 0.1
drug_dosing:
  # Historical field name retained for compatibility; simulation values only.
  dexmedetomidine:
    standard_dose: 0.5
    geriatric_dose: 0.25
    geriatric_age_threshold: 65
  ketamine:
    standard_dose: 0.2
  lidocaine:
    standard_dose: 1.5
contraindications:
  # Incomplete illustrative string matching, not a clinical contraindication database.
  dexmedetomidine:
    # Case-insensitive substring match; "Heart Block" also matches "complete heart block".
    cardiac_conditions: ["Heart Block", "AV Block", "Mobitz", "Sick Sinus Syndrome", "Severe Bradycardia"]
  ketorolac:
    egfr_minimum: 30
    allergy_triggers: ["NSAID", "Ketorolac", "Aspirin"]
simulation_rate_ceilings:
  # Software ceilings, not clinical maxima: the loop zeroes and latches any agent whose
  # in-memory rate is negative, non-finite or above these values. Units match drug_dosing
  # (dexmedetomidine mcg/kg/h; ketamine and lidocaine mg/kg/h). The lidocaine value matches the
  # upper infusion rate in the 2021 international consensus (Foo et al., Anaesthesia 2021;76:238-250),
  # which also specifies ideal body weight and a 24 h limit that this simulation does not model.
  Dexmedetomidine: 0.5
  Ketamine: 0.2
  Lidocaine: 1.5
age_adjustments:
  geriatric:
    age_threshold: 65
