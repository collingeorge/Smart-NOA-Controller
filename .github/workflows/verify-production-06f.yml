name: Verify production 06f
on:
  pull_request:
    paths:
      - .github/workflows/verify-production-06f.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6e48d8026cf365e056816c7d74b59a56cfb2133c
          persist-credentials: false
      - name: Record security headers independently for each route
        run: |
          for path in /simulator/ /about /source-pins.json /simulator/engine/sim.js /simulator/ui/plan-model.js /simulator/ui/app.js /simulator/ui/monitor.js /simulator/ui/debrief.js; do
            echo "$path"
            curl -sS --max-time 15 -o /dev/null -D - "https://collinbgeorge.com$path" | grep -Ei '^(HTTP/|content-security-policy:|strict-transport-security:|x-content-type-options:|x-frame-options:|cf-mitigated:)'
          done
      - name: Compare live runtime files byte for byte
        run: |
          set -euo pipefail
          for path in engine/sim.js ui/plan-model.js ui/app.js ui/monitor.js ui/debrief.js engine/palliative.js data/palliative.js; do
            curl --fail --silent --show-error --max-time 15 "https://collinbgeorge.com/simulator/$path" -o "$RUNNER_TEMP/public-asset"
            cmp "simulator/$path" "$RUNNER_TEMP/public-asset"
            echo "MATCH $path"
          done
      - run: node simulator/tools/verify-live.mjs 6e48d8026cf365e056816c7d74b59a56cfb2133c
