name: Verify case files and PDF
on:
  pull_request:
    paths:
      - .github/workflows/verify-production-06f.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 234ddbda1dd7e02aa53275c4eb393bc168873f6b
          persist-credentials: false
      - run: npm install --no-save --ignore-scripts playwright@1.57.0
      - run: npx playwright install chromium
      - name: Exercise the case-file browser workflows
        run: |
          cat > case-files-audit.cjs <<'EOF'
          const assert = require('node:assert/strict');
          const fs = require('node:fs/promises');
          const http = require('node:http');
          const path = require('node:path');
          const { chromium } = require('playwright');
          
          const root = path.resolve('simulator');
          const server = http.createServer(async (req, res) => {
            const url = new URL(req.url, 'http://localhost');
            const file = path.resolve(root, '.' + (url.pathname === '/' ? '/index.html' : url.pathname));
            if (!file.startsWith(root + path.sep)) { res.writeHead(404).end(); return; }
            try {
              const content = await fs.readFile(file);
              res.setHeader('Content-Type', { '.js': 'text/javascript', '.html': 'text/html', '.css': 'text/css' }[path.extname(file)] || 'text/plain');
              res.end(content);
            } catch { res.writeHead(404).end(); }
          });
          
          (async () => {
            let browser;
            try {
              await new Promise((resolve, reject) => server.once('error', reject).listen(0, '127.0.0.1', resolve));
              browser = await chromium.launch();
              const page = await browser.newPage();
              const errors = [];
              page.on('pageerror', (error) => errors.push(error.message));
              await page.goto(`http://127.0.0.1:${server.address().port}/`);
              for (const module of ['Perioperative', 'Palliative pain management', 'End-of-life care']) {
                await page.getByRole('button', { name: module, exact: true }).click();
                await page.getByRole('button', { name: 'Case files', exact: true }).click();
                const [download] = await Promise.all([page.waitForEvent('download'), page.getByRole('button', { name: 'Download example template' }).click()]);
                const originalFile = await download.path();
                const setup = JSON.parse(await fs.readFile(originalFile, 'utf8'));
                setup.patient.ageYears = 55;
                await page.locator('#case-file-input').setInputFiles({ name: 'edited.json', mimeType: 'application/json', buffer: Buffer.from(JSON.stringify(setup)) });
                await page.getByRole('button', { name: 'Import case', exact: true }).click();
                await page.locator(module === 'Perioperative' ? '#stepper-3[aria-current="step"]' : '#pal-root[data-step="2"]').waitFor();
                await page.getByRole('button', { name: 'Case files', exact: true }).click();
                const [exported] = await Promise.all([page.waitForEvent('download'), page.getByRole('button', { name: 'Export current case' }).click()]);
                assert.equal(JSON.parse(await fs.readFile(await exported.path(), 'utf8')).patient.ageYears, 55);
                await page.getByRole('button', { name: 'Close', exact: true }).click();
                console.log(module + ' template, import, and export passed');
              }
              await page.locator('#pal-stepper-1').click();
              await page.getByRole('combobox', { name: 'Example case' }).selectOption({ label: 'Refractory terminal delirium / agitation (palliative-sedation teaching case)' });
              await page.getByRole('button', { name: 'Load example case', exact: true }).click();
              await page.getByRole('button', { name: 'Continue to assessment & plan' }).click();
              await page.getByRole('button', { name: 'Approve & start regimen' }).click();
              await page.getByRole('button', { name: 'Go to debrief' }).click();
              const [report] = await Promise.all([page.waitForEvent('download'), page.getByRole('button', { name: 'Download debrief (PDF)' }).click()]);
              assert.match(report.suggestedFilename(), /\.pdf$/);
              const pdf = await fs.readFile(await report.path(), 'ascii');
              assert.match(pdf, /^%PDF-1\.4/);
              assert.match(pdf, /Fictional patient/);
              assert.match(pdf, /Reviewer feedback/);
              assert.deepEqual(errors, []);
              console.log('Debrief PDF and browser error checks passed');
            } finally {
              if (browser) await browser.close();
              server.close();
            }
          })().catch((error) => { console.error(error); process.exitCode = 1; });
          EOF
          node case-files-audit.cjs
